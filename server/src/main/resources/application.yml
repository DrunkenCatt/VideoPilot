spring:
  application:
    name: videopilot-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mysql,redis,rabbit,minio,qdrant
        dependencies:
          include: mysql,redis,rabbit,minio,qdrant
  health:
    db:
      enabled: false

videopilot:
  media:
    enabled: ${MEDIA_API_ENABLED:true}
    probe:
      enabled: ${MEDIA_PROBE_ENABLED:false}
      executable: ${FFPROBE_EXECUTABLE:ffprobe}
      timeout: ${MEDIA_PROBE_TIMEOUT:30s}
      max-output-bytes: ${MEDIA_PROBE_MAX_OUTPUT_BYTES:65536}
      max-concurrency: ${MEDIA_PROBE_MAX_CONCURRENCY:1}
      batch-size: ${MEDIA_PROBE_BATCH_SIZE:10}
      stale-after: ${MEDIA_PROBE_STALE_AFTER:5m}
      temporary-directory: ${MEDIA_PROBE_TEMP_DIRECTORY:${java.io.tmpdir}/videopilot-probe}
      sweep-delay: ${MEDIA_PROBE_SWEEP_DELAY:2s}
      initial-delay: ${MEDIA_PROBE_INITIAL_DELAY:2s}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    exchange: ${RABBITMQ_ANALYSIS_EXCHANGE:videopilot.analysis.exchange}
    queue: ${RABBITMQ_ANALYSIS_QUEUE:videopilot.analysis.queue}
    routing-key: ${RABBITMQ_ANALYSIS_ROUTING_KEY:analysis.execute}
    retry-exchange: ${RABBITMQ_ANALYSIS_RETRY_EXCHANGE:videopilot.analysis.retry.exchange}
    retry-queue: ${RABBITMQ_ANALYSIS_RETRY_QUEUE:videopilot.analysis.retry.queue}
    dead-letter-exchange: ${RABBITMQ_ANALYSIS_DLX:videopilot.analysis.dlx}
    dead-letter-queue: ${RABBITMQ_ANALYSIS_DLQ:videopilot.analysis.dead-letter.queue}
    retry-ttl: ${RABBITMQ_ANALYSIS_RETRY_TTL:10s}
    confirm-timeout: ${RABBITMQ_CONFIRM_TIMEOUT:5s}
    consumer:
      enabled: ${ANALYSIS_CONSUMER_ENABLED:false}
      max-retries: ${ANALYSIS_CONSUMER_MAX_RETRIES:3}
      max-payload-bytes: ${ANALYSIS_CONSUMER_MAX_PAYLOAD_BYTES:4096}
      prefetch: ${ANALYSIS_CONSUMER_PREFETCH:1}
      concurrency: ${ANALYSIS_CONSUMER_CONCURRENCY:1}
      lock-wait: ${ANALYSIS_CONSUMER_LOCK_WAIT:100ms}
      lock-lease: ${ANALYSIS_CONSUMER_LOCK_LEASE:30s}
    relay:
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
      lease-duration: ${OUTBOX_RELAY_LEASE_DURATION:30s}
      max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:5}
      retry-delay: ${OUTBOX_RELAY_RETRY_DELAY:5s}
      max-retry-delay: ${OUTBOX_RELAY_MAX_RETRY_DELAY:5m}
      fixed-delay: ${OUTBOX_RELAY_FIXED_DELAY:2s}
      initial-delay: ${OUTBOX_RELAY_INITIAL_DELAY:2s}
  analysis:
    pipeline-version: ${ANALYSIS_PIPELINE_VERSION:m1-fake-v1}
  storage:
    media:
      enabled: ${MEDIA_STORAGE_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_MEDIA_BUCKET:videopilot-media}
      region: ${MINIO_REGION:us-east-1}
      part-size: ${MEDIA_UPLOAD_PART_SIZE:8MB}
      max-parts: ${MEDIA_UPLOAD_MAX_PARTS:10000}
      session-ttl: ${MEDIA_UPLOAD_SESSION_TTL:1h}
      part-url-ttl: ${MEDIA_UPLOAD_PART_URL_TTL:15m}
      expiry-sweep-delay: ${MEDIA_UPLOAD_EXPIRY_SWEEP_DELAY:1m}
      expiry-batch-size: ${MEDIA_UPLOAD_EXPIRY_BATCH_SIZE:100}
  identity:
    session-ttl: ${IDENTITY_SESSION_TTL:8h}
    cookie-name: ${IDENTITY_COOKIE_NAME:VP_SESSION}
    secure-cookie: ${IDENTITY_SECURE_COOKIE:true}
    login-attempt-limit: ${IDENTITY_LOGIN_ATTEMPT_LIMIT:10}
    login-attempt-window: ${IDENTITY_LOGIN_ATTEMPT_WINDOW:15m}
    bootstrap-enabled: ${IDENTITY_BOOTSTRAP_ENABLED:false}
    bootstrap-username: ${IDENTITY_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${IDENTITY_BOOTSTRAP_PASSWORD:}
  providers:
    deepseek:
      provider: DeepSeek
      model-version: ${DEEPSEEK_MODEL_VERSION:deepseek-chat}
      timeout: ${DEEPSEEK_TIMEOUT:30s}
      cost-unit: token
      cost-tracking: true
    telespeech-asr:
      provider: TeleSpeechASR
      model-version: ${TELESPEECH_ASR_MODEL_VERSION:fixed-mvp}
      timeout: ${TELESPEECH_ASR_TIMEOUT:120s}
      cost-unit: audio-second
      cost-tracking: true
    bge-m3:
      provider: BGE-M3
      model-version: ${BGE_M3_MODEL_VERSION:bge-m3}
      timeout: ${BGE_M3_TIMEOUT:30s}
      cost-unit: token
      cost-tracking: true
    tesseract:
      provider: Tesseract
      model-version: ${TESSERACT_VERSION:5.x}
      timeout: ${TESSERACT_TIMEOUT:30s}
      cost-unit: local-image
      cost-tracking: false
  health:
    mysql:
      enabled: true
    external:
      enabled: true
      timeout: ${DEPENDENCY_HEALTH_TIMEOUT:2s}
      minio-url: ${MINIO_HEALTH_URL:http://localhost:9000/minio/health/ready}
      qdrant-url: ${QDRANT_HEALTH_URL:http://localhost:6333/healthz}

info:
  application:
    name: ${spring.application.name}

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-} jobId=%X{jobId:-} runId=%X{runId:-}] "
