spring:
  application:
    name: videopilot-server
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mysql,redis,rabbit,minio,qdrant
        dependencies:
          include: mysql,redis,rabbit,minio,qdrant
  health:
    db:
      enabled: false

videopilot:
  providers:
    deepseek:
      provider: DeepSeek
      model-version: ${DEEPSEEK_MODEL_VERSION:deepseek-chat}
      timeout: ${DEEPSEEK_TIMEOUT:30s}
      cost-unit: token
      cost-tracking: true
    telespeech-asr:
      provider: TeleSpeechASR
      model-version: ${TELESPEECH_ASR_MODEL_VERSION:fixed-mvp}
      timeout: ${TELESPEECH_ASR_TIMEOUT:120s}
      cost-unit: audio-second
      cost-tracking: true
    bge-m3:
      provider: BGE-M3
      model-version: ${BGE_M3_MODEL_VERSION:bge-m3}
      timeout: ${BGE_M3_TIMEOUT:30s}
      cost-unit: token
      cost-tracking: true
    tesseract:
      provider: Tesseract
      model-version: ${TESSERACT_VERSION:5.x}
      timeout: ${TESSERACT_TIMEOUT:30s}
      cost-unit: local-image
      cost-tracking: false
  health:
    mysql:
      enabled: true
    external:
      enabled: true
      timeout: ${DEPENDENCY_HEALTH_TIMEOUT:2s}
      minio-url: ${MINIO_HEALTH_URL:http://localhost:9000/minio/health/ready}
      qdrant-url: ${QDRANT_HEALTH_URL:http://localhost:6333/healthz}

info:
  application:
    name: ${spring.application.name}

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-} jobId=%X{jobId:-} runId=%X{runId:-}] "
