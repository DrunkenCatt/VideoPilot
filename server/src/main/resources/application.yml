spring:
  application:
    name: videopilot-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mysql,redis,rabbit,minio,qdrant
        dependencies:
          include: mysql,redis,rabbit,minio,qdrant
  health:
    db:
      enabled: false

videopilot:
  agent:
    enabled: ${AGENT_ENABLED:false}
    worker-enabled: ${AGENT_WORKER_ENABLED:false}
    goal-analysis-enabled: ${AGENT_GOAL_ANALYSIS_ENABLED:false}
    worker-delay: ${AGENT_WORKER_DELAY:1s}
    worker-initial-delay: ${AGENT_WORKER_INITIAL_DELAY:2s}
  answer:
    base-url: ${SILICONFLOW_LLM_BASE_URL:https://api.siliconflow.cn/v1}
    api-key: ${SILICONFLOW_API_KEY:}
    provider: SiliconFlow
    model: ${SILICONFLOW_LLM_MODEL_VERSION:deepseek-ai/DeepSeek-V4-Flash}
    prompt-version: ${ANSWER_PROMPT_VERSION:answer-evidence-v2}
    timeout: ${SILICONFLOW_LLM_TIMEOUT:120s}
    max-output-tokens: ${ANSWER_MAX_OUTPUT_TOKENS:1200}
    max-prompt-characters: ${ANSWER_MAX_PROMPT_CHARACTERS:20000}
    max-response-bytes: ${ANSWER_MAX_RESPONSE_BYTES:65536}
    max-concurrency: ${ANSWER_MAX_CONCURRENCY:1}
    minimum-evidence-score: ${ANSWER_MINIMUM_EVIDENCE_SCORE:0.20}
  retrieval:
    candidate-limit: ${RETRIEVAL_CANDIDATE_LIMIT:50}
    max-query-characters: ${RETRIEVAL_MAX_QUERY_CHARACTERS:1000}
    embedding:
      base-url: ${SILICONFLOW_EMBEDDING_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${SILICONFLOW_API_KEY:}
      provider: SiliconFlow
      model: ${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
      version: ${EMBEDDING_VERSION:siliconflow-bge-m3-1024-v1}
      timeout: ${SILICONFLOW_EMBEDDING_TIMEOUT:30s}
      dimensions: ${EMBEDDING_DIMENSIONS:1024}
      max-batch-size: ${EMBEDDING_MAX_BATCH_SIZE:4}
      max-text-characters: ${EMBEDDING_MAX_TEXT_CHARACTERS:6000}
      max-input-tokens-per-text: ${EMBEDDING_MAX_INPUT_TOKENS_PER_TEXT:8192}
      max-total-characters: ${EMBEDDING_MAX_TOTAL_CHARACTERS:100000}
      max-response-bytes: ${EMBEDDING_MAX_RESPONSE_BYTES:8388608}
      max-concurrency: ${EMBEDDING_MAX_CONCURRENCY:1}
      max-attempts: ${EMBEDDING_MAX_ATTEMPTS:3}
    qdrant:
      base-url: ${QDRANT_BASE_URL:http://localhost:6333}
      collection: ${QDRANT_COLLECTION:videopilot_chunks_m3_bge_m3_1024_v1}
      timeout: ${QDRANT_TIMEOUT:5s}
      max-response-bytes: ${QDRANT_MAX_RESPONSE_BYTES:1048576}
  context:
    ocr:
      enabled: ${OCR_ENABLED:false}
      executable: ${TESSERACT_EXECUTABLE:tesseract}
      tessdata-directory: ${TESSDATA_DIRECTORY:}
      language: ${TESSERACT_LANGUAGE:eng}
      provider: Tesseract
      timeout: ${TESSERACT_TIMEOUT:30s}
      temporary-directory: ${OCR_TEMPORARY_DIRECTORY:${java.io.tmpdir}/videopilot-ocr}
      max-output-bytes: ${OCR_MAX_OUTPUT_BYTES:1048576}
      max-text-characters: ${OCR_MAX_TEXT_CHARACTERS:100000}
      max-image-bytes: ${OCR_MAX_IMAGE_BYTES:20971520}
      max-pixels: ${OCR_MAX_PIXELS:40000000}
      max-concurrency: ${OCR_MAX_CONCURRENCY:1}
      queue-capacity: ${OCR_QUEUE_CAPACITY:4}
      max-attempts: ${OCR_MAX_ATTEMPTS:2}
    asr:
      enabled: ${ASR_ENABLED:false}
      base-url: ${SILICONFLOW_ASR_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${SILICONFLOW_API_KEY:}
      provider: SiliconFlow
      model-version: ${TELESPEECH_ASR_MODEL_VERSION:TeleAI/TeleSpeechASR}
      timeout: ${TELESPEECH_ASR_TIMEOUT:120s}
      temporary-directory: ${ASR_TEMPORARY_DIRECTORY:${java.io.tmpdir}/videopilot-asr}
      max-audio-bytes: ${ASR_MAX_AUDIO_BYTES:52428800}
      max-response-bytes: ${ASR_MAX_RESPONSE_BYTES:1048576}
      max-concurrency: ${ASR_MAX_CONCURRENCY:1}
      queue-capacity: ${ASR_QUEUE_CAPACITY:2}
      max-attempts: ${ASR_MAX_ATTEMPTS:3}
      max-output-characters-per-minute: ${ASR_MAX_OUTPUT_CHARACTERS_PER_MINUTE:1200}
    derivation:
      enabled: ${CONTEXT_DERIVATION_ENABLED:false}
      executable: ${FFMPEG_EXECUTABLE:ffmpeg}
      temporary-directory: ${CONTEXT_TEMPORARY_DIRECTORY:${java.io.tmpdir}/videopilot-context}
      extraction-version: ${CONTEXT_EXTRACTION_VERSION:ffmpeg-extract-v1}
      ffmpeg-version: ${FFMPEG_VERSION:ffmpeg-6-v1}
      timeout: ${FFMPEG_DERIVATION_TIMEOUT:2h}
      max-log-bytes: ${FFMPEG_MAX_LOG_BYTES:65536}
      max-concurrency: ${FFMPEG_MAX_CONCURRENCY:1}
      audio-slice-duration: ${AUDIO_SLICE_DURATION:60s}
      fallback-frame-interval: ${FRAME_FALLBACK_INTERVAL:30s}
      max-frames-per-minute: ${MAX_FRAMES_PER_MINUTE:6}
      max-output-files: ${FFMPEG_MAX_OUTPUT_FILES:20000}
      max-output-bytes: ${FFMPEG_MAX_OUTPUT_BYTES:21474836480}
  media:
    enabled: ${MEDIA_API_ENABLED:true}
    probe:
      enabled: ${MEDIA_PROBE_ENABLED:false}
      executable: ${FFPROBE_EXECUTABLE:ffprobe}
      timeout: ${MEDIA_PROBE_TIMEOUT:30s}
      max-output-bytes: ${MEDIA_PROBE_MAX_OUTPUT_BYTES:65536}
      max-concurrency: ${MEDIA_PROBE_MAX_CONCURRENCY:1}
      batch-size: ${MEDIA_PROBE_BATCH_SIZE:10}
      stale-after: ${MEDIA_PROBE_STALE_AFTER:5m}
      temporary-directory: ${MEDIA_PROBE_TEMP_DIRECTORY:${java.io.tmpdir}/videopilot-probe}
      sweep-delay: ${MEDIA_PROBE_SWEEP_DELAY:2s}
      initial-delay: ${MEDIA_PROBE_INITIAL_DELAY:2s}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    exchange: ${RABBITMQ_ANALYSIS_EXCHANGE:videopilot.analysis.exchange}
    queue: ${RABBITMQ_ANALYSIS_QUEUE:videopilot.analysis.queue}
    routing-key: ${RABBITMQ_ANALYSIS_ROUTING_KEY:analysis.execute}
    retry-exchange: ${RABBITMQ_ANALYSIS_RETRY_EXCHANGE:videopilot.analysis.retry.exchange}
    retry-queue: ${RABBITMQ_ANALYSIS_RETRY_QUEUE:videopilot.analysis.retry.queue}
    dead-letter-exchange: ${RABBITMQ_ANALYSIS_DLX:videopilot.analysis.dlx}
    dead-letter-queue: ${RABBITMQ_ANALYSIS_DLQ:videopilot.analysis.dead-letter.queue}
    retry-ttl: ${RABBITMQ_ANALYSIS_RETRY_TTL:10s}
    confirm-timeout: ${RABBITMQ_CONFIRM_TIMEOUT:5s}
    consumer:
      enabled: ${ANALYSIS_CONSUMER_ENABLED:false}
      max-retries: ${ANALYSIS_CONSUMER_MAX_RETRIES:3}
      max-payload-bytes: ${ANALYSIS_CONSUMER_MAX_PAYLOAD_BYTES:4096}
      prefetch: ${ANALYSIS_CONSUMER_PREFETCH:1}
      concurrency: ${ANALYSIS_CONSUMER_CONCURRENCY:1}
      lock-wait: ${ANALYSIS_CONSUMER_LOCK_WAIT:100ms}
      lock-lease: ${ANALYSIS_CONSUMER_LOCK_LEASE:30s}
    relay:
      batch-size: ${OUTBOX_RELAY_BATCH_SIZE:50}
      lease-duration: ${OUTBOX_RELAY_LEASE_DURATION:30s}
      max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:5}
      retry-delay: ${OUTBOX_RELAY_RETRY_DELAY:5s}
      max-retry-delay: ${OUTBOX_RELAY_MAX_RETRY_DELAY:5m}
      fixed-delay: ${OUTBOX_RELAY_FIXED_DELAY:2s}
      initial-delay: ${OUTBOX_RELAY_INITIAL_DELAY:2s}
  analysis:
    pipeline-version: ${ANALYSIS_PIPELINE_VERSION:m3-evidence-qa-v1}
    limits:
      version: ${EXECUTION_LIMIT_VERSION:m6-limits-v2}
      job-deadline: ${ANALYSIS_JOB_DEADLINE:6h}
      provider-wait: ${PROVIDER_CAPACITY_WAIT:250ms}
      max-asr-calls: ${BUDGET_MAX_ASR_CALLS:240}
      max-ocr-calls: ${BUDGET_MAX_OCR_CALLS:2000}
      max-embedding-calls: ${BUDGET_MAX_EMBEDDING_CALLS:1000}
      max-answer-calls: ${BUDGET_MAX_ANSWER_CALLS:20}
      max-agent-plan-calls: ${BUDGET_MAX_AGENT_PLAN_CALLS:2}
      max-agent-critique-calls: ${BUDGET_MAX_AGENT_CRITIQUE_CALLS:2}
      max-asr-input-units: ${BUDGET_MAX_ASR_INPUT_UNITS:5400000}
      max-asr-output-units: ${BUDGET_MAX_ASR_OUTPUT_UNITS:108000}
      max-ocr-input-units: ${BUDGET_MAX_OCR_INPUT_UNITS:21600000000}
      max-ocr-output-units: ${BUDGET_MAX_OCR_OUTPUT_UNITS:54000000}
      max-embedding-input-units: ${BUDGET_MAX_EMBEDDING_INPUT_UNITS:1000000}
      max-embedding-output-units: ${BUDGET_MAX_EMBEDDING_OUTPUT_UNITS:1}
      max-answer-input-units: ${BUDGET_MAX_ANSWER_INPUT_UNITS:100000}
      max-answer-output-units: ${BUDGET_MAX_ANSWER_OUTPUT_UNITS:24000}
      max-agent-plan-input-units: ${BUDGET_MAX_AGENT_PLAN_INPUT_UNITS:10000}
      max-agent-plan-output-units: ${BUDGET_MAX_AGENT_PLAN_OUTPUT_UNITS:2000}
      max-agent-critique-input-units: ${BUDGET_MAX_AGENT_CRITIQUE_INPUT_UNITS:20000}
      max-agent-critique-output-units: ${BUDGET_MAX_AGENT_CRITIQUE_OUTPUT_UNITS:2000}
      max-known-cost: ${BUDGET_MAX_KNOWN_COST:10.00}
    recovery:
      max-retries: ${ANALYSIS_RECOVERY_MAX_RETRIES:3}
      retry-delay: ${ANALYSIS_RECOVERY_RETRY_DELAY:10s}
      lease-duration: ${ANALYSIS_RECOVERY_LEASE_DURATION:90s}
      scan-delay: ${ANALYSIS_RECOVERY_SCAN_DELAY:10s}
      initial-delay: ${ANALYSIS_RECOVERY_INITIAL_DELAY:10s}
      batch-size: ${ANALYSIS_RECOVERY_BATCH_SIZE:50}
    active-cache:
      ttl: ${ANALYSIS_ACTIVE_CACHE_TTL:30m}
  storage:
    media:
      enabled: ${MEDIA_STORAGE_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_MEDIA_BUCKET:videopilot-media}
      region: ${MINIO_REGION:us-east-1}
      part-size: ${MEDIA_UPLOAD_PART_SIZE:8MB}
      max-parts: ${MEDIA_UPLOAD_MAX_PARTS:10000}
      session-ttl: ${MEDIA_UPLOAD_SESSION_TTL:1h}
      part-url-ttl: ${MEDIA_UPLOAD_PART_URL_TTL:15m}
      expiry-sweep-delay: ${MEDIA_UPLOAD_EXPIRY_SWEEP_DELAY:1m}
      expiry-batch-size: ${MEDIA_UPLOAD_EXPIRY_BATCH_SIZE:100}
  identity:
    session-ttl: ${IDENTITY_SESSION_TTL:8h}
    cookie-name: ${IDENTITY_COOKIE_NAME:VP_SESSION}
    secure-cookie: ${IDENTITY_SECURE_COOKIE:true}
    login-attempt-limit: ${IDENTITY_LOGIN_ATTEMPT_LIMIT:10}
    login-attempt-window: ${IDENTITY_LOGIN_ATTEMPT_WINDOW:15m}
    bootstrap-enabled: ${IDENTITY_BOOTSTRAP_ENABLED:false}
    bootstrap-username: ${IDENTITY_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${IDENTITY_BOOTSTRAP_PASSWORD:}
  providers:
    deepseek:
      provider: SiliconFlow
      model-version: ${SILICONFLOW_LLM_MODEL_VERSION:deepseek-ai/DeepSeek-V4-Flash}
      timeout: ${SILICONFLOW_LLM_TIMEOUT:120s}
      cost-unit: token
      cost-tracking: true
    telespeech-asr:
      provider: SiliconFlow
      model-version: ${TELESPEECH_ASR_MODEL_VERSION:TeleAI/TeleSpeechASR}
      timeout: ${TELESPEECH_ASR_TIMEOUT:120s}
      cost-unit: audio-second
      cost-tracking: true
    bge-m3:
      provider: BGE-M3
      model-version: ${BGE_M3_MODEL_VERSION:bge-m3}
      timeout: ${BGE_M3_TIMEOUT:30s}
      cost-unit: token
      cost-tracking: true
    tesseract:
      provider: Tesseract
      model-version: ${TESSERACT_VERSION:5.x}
      timeout: ${TESSERACT_TIMEOUT:30s}
      cost-unit: local-image
      cost-tracking: false
  health:
    mysql:
      enabled: true
    external:
      enabled: true
      timeout: ${DEPENDENCY_HEALTH_TIMEOUT:2s}
      minio-url: ${MINIO_HEALTH_URL:http://localhost:9000/minio/health/ready}
      qdrant-url: ${QDRANT_HEALTH_URL:http://localhost:6333/healthz}

info:
  application:
    name: ${spring.application.name}

logging:
  pattern:
    correlation: "[requestId=%X{requestId:-} jobId=%X{jobId:-} runId=%X{runId:-}] "
