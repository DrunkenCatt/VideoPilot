spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:videopilot}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${MYSQL_USER:videopilot}
    password: ${MYSQL_PASSWORD:videopilot_local}
    hikari:
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${MYSQL_VALIDATION_TIMEOUT:1000}
  flyway:
    clean-disabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:videopilot}
    password: ${RABBITMQ_PASSWORD:videopilot_local}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:2s}

videopilot:
  evaluation:
    # Integration contexts share one database; background claims must be enabled explicitly.
    worker-enabled: false
  analysis:
    recovery:
      scan-delay: 1h
      initial-delay: 1h
  storage:
    media:
      enabled: true
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:videopilot}
      secret-key: ${MINIO_SECRET_KEY:videopilot_local}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
    exchange: ${RABBITMQ_ANALYSIS_EXCHANGE:videopilot.integration.analysis.exchange}
    queue: ${RABBITMQ_ANALYSIS_QUEUE:videopilot.integration.analysis.queue}
    routing-key: ${RABBITMQ_ANALYSIS_ROUTING_KEY:analysis.integration.execute}
    retry-exchange: ${RABBITMQ_ANALYSIS_RETRY_EXCHANGE:videopilot.integration.analysis.retry.exchange}
    retry-queue: ${RABBITMQ_ANALYSIS_RETRY_QUEUE:videopilot.integration.analysis.retry.queue}
    dead-letter-exchange: ${RABBITMQ_ANALYSIS_DLX:videopilot.integration.analysis.dlx}
    dead-letter-queue: ${RABBITMQ_ANALYSIS_DLQ:videopilot.integration.analysis.dead-letter.queue}
    relay:
      initial-delay: ${OUTBOX_RELAY_INITIAL_DELAY:1h}
  health:
    external:
      timeout: ${DEPENDENCY_HEALTH_TIMEOUT:2s}
      minio-url: ${MINIO_HEALTH_URL:http://localhost:9000/minio/health/ready}
      qdrant-url: ${QDRANT_HEALTH_URL:http://localhost:6333/healthz}
