name: videopilot

services:
  server:
    build:
      context: ./server
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-videopilot}
      MYSQL_USER: ${MYSQL_USER:-videopilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-videopilot_local}
      MYSQL_CONNECTION_TIMEOUT: ${MYSQL_CONNECTION_TIMEOUT:-2000}
      MYSQL_VALIDATION_TIMEOUT: ${MYSQL_VALIDATION_TIMEOUT:-1000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-2s}
      REDIS_COMMAND_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-2s}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_CONNECTION_TIMEOUT: ${RABBITMQ_CONNECTION_TIMEOUT:-2s}
      IDENTITY_BOOTSTRAP_ENABLED: ${IDENTITY_BOOTSTRAP_ENABLED:-false}
      IDENTITY_BOOTSTRAP_USERNAME: ${IDENTITY_BOOTSTRAP_USERNAME:-}
      IDENTITY_BOOTSTRAP_PASSWORD: ${IDENTITY_BOOTSTRAP_PASSWORD:-}
      IDENTITY_SECURE_COOKIE: ${IDENTITY_SECURE_COOKIE:-false}
      MEDIA_STORAGE_ENABLED: "true"
      MEDIA_PROBE_ENABLED: "true"
      FFPROBE_EXECUTABLE: ${FFPROBE_EXECUTABLE:-ffprobe}
      MEDIA_PROBE_TIMEOUT: ${MEDIA_PROBE_TIMEOUT:-30s}
      MEDIA_PROBE_MAX_OUTPUT_BYTES: ${MEDIA_PROBE_MAX_OUTPUT_BYTES:-65536}
      MEDIA_PROBE_MAX_CONCURRENCY: ${MEDIA_PROBE_MAX_CONCURRENCY:-1}
      MEDIA_PROBE_BATCH_SIZE: ${MEDIA_PROBE_BATCH_SIZE:-10}
      MEDIA_PROBE_STALE_AFTER: ${MEDIA_PROBE_STALE_AFTER:-5m}
      MEDIA_PROBE_SWEEP_DELAY: ${MEDIA_PROBE_SWEEP_DELAY:-2s}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-videopilot}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-videopilot_local}
      MINIO_MEDIA_BUCKET: ${MINIO_MEDIA_BUCKET:-videopilot-media}
      MEDIA_UPLOAD_PART_SIZE: ${MEDIA_UPLOAD_PART_SIZE:-8MB}
      MEDIA_UPLOAD_MAX_PARTS: ${MEDIA_UPLOAD_MAX_PARTS:-10000}
      MEDIA_UPLOAD_SESSION_TTL: ${MEDIA_UPLOAD_SESSION_TTL:-1h}
      MEDIA_UPLOAD_PART_URL_TTL: ${MEDIA_UPLOAD_PART_URL_TTL:-15m}
      MINIO_HEALTH_URL: http://minio:9000/minio/health/ready
      QDRANT_HEALTH_URL: http://qdrant:6333/healthz
      DEPENDENCY_HEALTH_TIMEOUT: ${DEPENDENCY_HEALTH_TIMEOUT:-2s}
      ANALYSIS_CONSUMER_ENABLED: ${ANALYSIS_CONSUMER_ENABLED:-true}
      ANALYSIS_CONSUMER_MAX_RETRIES: ${ANALYSIS_CONSUMER_MAX_RETRIES:-3}
      ANALYSIS_CONSUMER_MAX_PAYLOAD_BYTES: ${ANALYSIS_CONSUMER_MAX_PAYLOAD_BYTES:-4096}
      ANALYSIS_CONSUMER_PREFETCH: ${ANALYSIS_CONSUMER_PREFETCH:-1}
      ANALYSIS_CONSUMER_CONCURRENCY: ${ANALYSIS_CONSUMER_CONCURRENCY:-1}
      ANALYSIS_CONSUMER_LOCK_WAIT: ${ANALYSIS_CONSUMER_LOCK_WAIT:-100ms}
      ANALYSIS_CONSUMER_LOCK_LEASE: ${ANALYSIS_CONSUMER_LOCK_LEASE:-30s}
      ANALYSIS_PIPELINE_VERSION: ${ANALYSIS_PIPELINE_VERSION:-m3-evidence-qa-v1}
      ANALYSIS_ACTIVE_CACHE_TTL: ${ANALYSIS_ACTIVE_CACHE_TTL:-30m}
      CONTEXT_DERIVATION_ENABLED: ${CONTEXT_DERIVATION_ENABLED:-true}
      FFMPEG_EXECUTABLE: ${FFMPEG_EXECUTABLE:-ffmpeg}
      FFMPEG_DERIVATION_TIMEOUT: ${FFMPEG_DERIVATION_TIMEOUT:-2h}
      FFMPEG_MAX_LOG_BYTES: ${FFMPEG_MAX_LOG_BYTES:-65536}
      FFMPEG_MAX_CONCURRENCY: ${FFMPEG_MAX_CONCURRENCY:-1}
      AUDIO_SLICE_DURATION: ${AUDIO_SLICE_DURATION:-60s}
      FRAME_FALLBACK_INTERVAL: ${FRAME_FALLBACK_INTERVAL:-30s}
      MAX_FRAMES_PER_MINUTE: ${MAX_FRAMES_PER_MINUTE:-6}
      FFMPEG_MAX_OUTPUT_FILES: ${FFMPEG_MAX_OUTPUT_FILES:-20000}
      FFMPEG_MAX_OUTPUT_BYTES: ${FFMPEG_MAX_OUTPUT_BYTES:-21474836480}
      ASR_ENABLED: ${ASR_ENABLED:-false}
      SILICONFLOW_ASR_BASE_URL: ${SILICONFLOW_ASR_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_LLM_MODEL_VERSION: ${SILICONFLOW_LLM_MODEL_VERSION:-deepseek-ai/DeepSeek-V4-Flash}
      SILICONFLOW_LLM_TIMEOUT: ${SILICONFLOW_LLM_TIMEOUT:-30s}
      TELESPEECH_ASR_MODEL_VERSION: ${TELESPEECH_ASR_MODEL_VERSION:-TeleAI/TeleSpeechASR}
      TELESPEECH_ASR_TIMEOUT: ${TELESPEECH_ASR_TIMEOUT:-120s}
      ASR_MAX_AUDIO_BYTES: ${ASR_MAX_AUDIO_BYTES:-52428800}
      ASR_MAX_RESPONSE_BYTES: ${ASR_MAX_RESPONSE_BYTES:-1048576}
      ASR_MAX_CONCURRENCY: ${ASR_MAX_CONCURRENCY:-1}
      ASR_QUEUE_CAPACITY: ${ASR_QUEUE_CAPACITY:-2}
      ASR_MAX_ATTEMPTS: ${ASR_MAX_ATTEMPTS:-3}
      OCR_ENABLED: ${OCR_ENABLED:-false}
      TESSERACT_EXECUTABLE: ${TESSERACT_EXECUTABLE:-tesseract}
      TESSDATA_DIRECTORY: ${TESSDATA_DIRECTORY:-/usr/share/tesseract-ocr/5/tessdata}
      TESSERACT_LANGUAGE: ${TESSERACT_LANGUAGE:-chi_sim+eng}
      TESSERACT_TIMEOUT: ${TESSERACT_TIMEOUT:-30s}
      OCR_MAX_OUTPUT_BYTES: ${OCR_MAX_OUTPUT_BYTES:-1048576}
      OCR_MAX_TEXT_CHARACTERS: ${OCR_MAX_TEXT_CHARACTERS:-100000}
      OCR_MAX_IMAGE_BYTES: ${OCR_MAX_IMAGE_BYTES:-20971520}
      OCR_MAX_PIXELS: ${OCR_MAX_PIXELS:-40000000}
      OCR_MAX_CONCURRENCY: ${OCR_MAX_CONCURRENCY:-1}
      OCR_QUEUE_CAPACITY: ${OCR_QUEUE_CAPACITY:-4}
      OCR_MAX_ATTEMPTS: ${OCR_MAX_ATTEMPTS:-2}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-videopilot}
      MYSQL_USER: ${MYSQL_USER:-videopilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-videopilot_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-videopilot_root_local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-videopilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-videopilot_local}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-videopilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-videopilot_local}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  qdrant-data:
